<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 20" width="100%" height="20">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="25%" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Subtle Glowing Horizon Line -->
  <line x1="40" y1="10" x2="880" y2="10" stroke="url(#divGrad)" stroke-width="1.5" filter="url(#divGlow)"/>
  
  <!-- Center Tech Diamond Node -->
  <polygon points="460,5 465,10 460,15 455,10" fill="#22D3EE" filter="url(#divGlow)"/>
  <circle cx="460" cy="10" r="1.5" fill="#FFFFFF"/>
</svg>
