<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#071426"/>
      <stop offset="85%" stop-color="#0B1628"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Cyan Text Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Subtle Circuit Trace Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#082F49" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Isometric Matrix Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="30" cy="0" r="1" fill="#22D3EE" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.15); }
    }
    @keyframes sweepLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif; font-weight: 800; }
  </style>

  <!-- Container Box with Rounded Chamfer -->
  <rect width="920" height="280" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- High-Tech Background Grid -->
  <rect width="920" height="280" rx="16" fill="url(#techGrid)"/>

  <!-- Corner Tech Accent Brackets -->
  <path d="M 24 40 L 24 24 L 40 24" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.8"/>
  <path d="M 896 40 L 896 24 L 880 24" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.8"/>
  <path d="M 24 240 L 24 256 L 40 256" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.8"/>
  <path d="M 896 240 L 896 256 L 880 256" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.8"/>

  <!-- Geometric Circuit Traces (Left & Right Wings) -->
  <g stroke="url(#circuitGrad)" stroke-width="1.5" fill="none">
    <path d="M 40 140 L 120 140 L 150 110 L 210 110" />
    <path d="M 50 180 L 130 180 L 160 210 L 240 210" />
    <path d="M 710 110 L 770 110 L 800 140 L 880 140" />
    <path d="M 680 210 L 760 210 L 790 180 L 870 180" />
  </g>

  <!-- Circuit Trace Nodes -->
  <circle cx="210" cy="110" r="3.5" fill="#22D3EE" opacity="0.7"/>
  <circle cx="240" cy="210" r="3" fill="#67E8F9" opacity="0.6"/>
  <circle cx="710" cy="110" r="3.5" fill="#22D3EE" opacity="0.7"/>
  <circle cx="680" cy="210" r="3" fill="#67E8F9" opacity="0.6"/>

  <!-- Status Telemetry Badge (Top Center) -->
  <g transform="translate(355, 34)">
    <rect width="210" height="26" rx="13" fill="#071426" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="13" r="4.5" fill="#22D3EE" filter="url(#subtleGlow)"/>
    <text x="30" y="17" fill="#67E8F9" class="mono" font-size="10.5" font-weight="600" letter-spacing="1.2">SYSTEM ACTIVE · ONLINE</text>
  </g>

  <!-- Central Identity Content -->
  <g text-anchor="middle">
    <!-- Main Name -->
    <text x="460" y="128" fill="url(#cyanGrad)" class="display" font-size="48" letter-spacing="4" filter="url(#subtleGlow)">
      AADVIK GEMINI
    </text>

    <!-- Subtitle Role -->
    <text x="460" y="166" fill="#C9D1D9" class="mono" font-size="14.5" font-weight="600" letter-spacing="2.8">
      CS &amp; AI/ML STUDENT <tspan fill="#22D3EE">·</tspan> DEVELOPER <tspan fill="#22D3EE">·</tspan> BUILDER
    </text>

    <!-- Subtle Separator Line with Center Diamond -->
    <line x1="280" y1="188" x2="640" y2="188" stroke="#1E293B" stroke-width="1.2"/>
    <polygon points="460,184 464,188 460,192 456,188" fill="#22D3EE"/>

    <!-- Tagline -->
    <text x="460" y="218" fill="#67E8F9" class="mono" font-size="13" font-weight="700" letter-spacing="4.5">
      LEARN. ENGINEER. BUILD. REPEAT.
    </text>

    <!-- Bottom Metadata Coordinates -->
    <text x="460" y="248" fill="#94A3B8" class="mono" font-size="10" letter-spacing="1.5">
      NEWTON SCHOOL OF TECHNOLOGY · RISHIHOOD UNIVERSITY
    </text>
  </g>
</svg>
